[project]
name = "flight-visualizer-backend"
version = "0.1.0"
description = "Relays flight_visualizer_bridge state and commands to the dashboard."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "protobuf>=7.36.2",
    "uvicorn[standard]>=0.54",
]

[tool.uv]
# Use the container's Python rather than downloading one.
python-preference = "only-system"

[tool.ruff]
line-length = 99
# Generated by generate.sh.
extend-exclude = ["*_pb2.py"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ANN"]
# Any is allowed for JSON values.
ignore = ["ANN401"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.pyright]
# The uv environment; run `uv sync` first.
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"

[dependency-groups]
dev = [
    "grpcio-tools>=1.85.1",
]
